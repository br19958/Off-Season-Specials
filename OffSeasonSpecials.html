<script>
    // --- SPREADSHEET CONFIGURATION ---
    const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/156ocyQT7qAUlGN3e_AT3CZF_vegCzqagOxK77Ewo8f8/export?format=csv&gid=0';

    // --- DATA STRUCTURE ---
    let spreadsheetData = [];
    let availableCities = [];
    const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const ALL_CITIES_ID = 'city-all';


    /**
     * LOGIC FOR 'SELECT ALL' CHECKBOX
     * Checks/Unchecks all individual city boxes and triggers the filter.
     */
    function toggleAllCities(event) {
        // Get the desired state from the 'All Cities' checkbox
        const isChecked = event.target.checked;
        
        // Find all individual city checkboxes
        const cityCheckboxes = document.querySelectorAll('#cityCheckboxes input[type="checkbox"]:not(#' + ALL_CITIES_ID + ')');
        
        // Apply the 'checked' state to all of them
        cityCheckboxes.forEach(checkbox => {
            checkbox.checked = isChecked;
        });

        // After changing the states, filter the table
        filterTable();
    }


    /**
     * LOGIC FOR INDIVIDUAL CITY CHECKBOXES
     * Handles unchecking the 'All' checkbox when any individual city is unchecked.
     */
    function handleIndividualCityChange() {
        const allCheckbox = document.getElementById(ALL_CITIES_ID);
        if (!allCheckbox) {
            filterTable(); // Fallback if 'All' isn't loaded yet
            return;
        }

        // Get all individual city checkboxes
        const individualCheckboxes = document.querySelectorAll('#cityCheckboxes input[type="checkbox"]:not(#' + ALL_CITIES_ID + ')');
        
        // Check if ALL individual checkboxes are checked
        const allChecked = Array.from(individualCheckboxes).every(checkbox => checkbox.checked);

        // Synchronize the 'All' checkbox state
        allCheckbox.checked = allChecked;

        // Always run the main filter logic
        filterTable();
    }

    // --- ORIGINAL parseCSV FUNCTION (NO CHANGES NEEDED) ---
    function parseCSV(csvText) {
        const lines = csvText.trim().split('\n');
        if (lines.length <= 2) return []; 
        
        const data = [];

        for (let i = 2; i < lines.length; i++) { 
            const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (values.length < 2) continue;

            const finalObject = {};

            const cleanValue = (val) => {
                if (val === undefined || val === null) return null; 
                let value = val.trim();
                if (value.startsWith('"') && value.endsWith('"')) {
                    value = value.substring(1, value.length - 1).trim();
                }
                return value === '' ? null : value; 
            };

            finalObject.restaurant = cleanValue(values[0]);

            if (finalObject.restaurant && finalObject.restaurant.toUpperCase().includes('NOTES:')) {
                continue; 
            }
            if (finalObject.restaurant === '* Certain Restrictions Apply') {
                continue; 
            }

            finalObject.city = cleanValue(values[1]);
            
            daysOfWeek.forEach((day, index) => {
                const valueIndex = index + 2; 
                finalObject[day] = cleanValue(values[valueIndex]);
            });
            
            if (finalObject.restaurant && finalObject.city) {
                data.push(finalObject);
            }
        }
        return data;
    }


    /**
     * Filters and renders the table based on selected cities and day of the week.
     * CRITICAL FIX: The logic here ensures it only looks at CHECKED individual boxes.
     */
    function filterTable() {
        // 1. Get Selected Cities (from checkboxes)
        // Find all CHECKED individual city checkboxes (excluding the 'All' checkbox)
        const citiesToFilter = Array.from(document.querySelectorAll('#cityCheckboxes input[type="checkbox"]:checked:not(#' + ALL_CITIES_ID + ')'))
                                     .map(cb => cb.value);

        // 2. Get Selected Day (from dropdown)
        const selectedDay = document.getElementById('dayFilter').value;

        const tbody = document.getElementById('dataBody');
        tbody.innerHTML = ''; // Clear existing rows
        
        // If no city is selected, show the "Please select" message.
        if (citiesToFilter.length === 0) {
             const row = tbody.insertRow();
             row.className = 'bg-white';
             const cell = row.insertCell(0);
             cell.colSpan = 3;
             cell.className = 'py-4 px-6 text-center text-gray-500 italic';
             cell.textContent = `Please select at least one City and Day.`;
             return;
        }

        // Filter the data
        const filteredData = spreadsheetData.filter(item => {
            // Check 1: City must be in the list of selected cities
            const cityMatch = citiesToFilter.includes(item.city);

            // Check 2: Content for the selected day must be present
            const content = item[selectedDay];
            const dayMatch = content && content.trim() !== '';

            return cityMatch && dayMatch;
        });

        // Render filtered data
        if (filteredData.length === 0) {
            const row = tbody.insertRow();
            row.className = 'bg-white';
            const cell = row.insertCell(0);
            cell.colSpan = 3;
            cell.className = 'py-4 px-6 text-center text-gray-500 italic';
            cell.textContent = `No available information found for the selected cities on ${selectedDay}.`;
        } else {
            filteredData.forEach(item => {
                const row = tbody.insertRow();
                row.className = 'bg-white border-b hover:bg-indigo-50 transition duration-150';

                let cell0 = row.insertCell(0);
                cell0.className = 'px-6 py-4 text-gray-900 font-medium';
                cell0.textContent = item.city;

                let cell1 = row.insertCell(1);
                cell1.className = 'px-6 py-4 text-sm text-gray-700';
                cell1.textContent = item.restaurant;

                const content = item[selectedDay];
                const contentCell = row.insertCell(2);
                contentCell.className = 'px-6 py-4 text-sm max-w-lg';
                contentCell.innerHTML = `<span class="inline-block px-3 py-1 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-800 mr-2">${selectedDay}</span>${content}`;
            });
        }
    }

    /**
     * Initializes filter controls and attaches event listeners.
     */
    function initializeFilters() {
        availableCities = [...new Set(spreadsheetData.map(item => item.city))].sort();
        
        const cityCheckboxesContainer = document.getElementById('cityCheckboxes');
        const dayFilter = document.getElementById('dayFilter');

        cityCheckboxesContainer.innerHTML = '';
        dayFilter.innerHTML = '';

        // --- 1. Add the 'Select All' Checkbox ---
        const allCheckboxDiv = document.createElement('div');
        allCheckboxDiv.className = 'flex items-center border-r pr-6 border-gray-300 mr-6 font-bold text-indigo-600';

        const allCheckbox = document.createElement('input');
        allCheckbox.type = 'checkbox';
        allCheckbox.id = ALL_CITIES_ID;
        allCheckbox.value = 'ALL'; 
        allCheckbox.checked = true; // DEFAULT TO ALL SELECTED
        allCheckbox.className = 'form-checkbox h-5 w-5 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300';
        allCheckbox.addEventListener('change', toggleAllCities); 

        const allLabel = document.createElement('label');
        allLabel.htmlFor = ALL_CITIES_ID;
        allLabel.className = 'ml-2 text-base cursor-pointer select-none';
        allLabel.textContent = 'All Cities';

        allCheckboxDiv.appendChild(allCheckbox);
        allCheckboxDiv.appendChild(allLabel);
        cityCheckboxesContainer.appendChild(allCheckboxDiv);


        // 2. Populate Individual Cities (Checkboxes) 
        availableCities.forEach(city => {
            const id = `city-${city.replace(/\s/g, '-')}`;
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = id;
            checkbox.value = city;
            checkbox.checked = true; // CRITICAL FIX: Must be true initially to match 'All Cities' state
            checkbox.className = 'form-checkbox h-4 w-4 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300';
            checkbox.addEventListener('change', handleIndividualCityChange); 

            const label = document.createElement('label');
            label.htmlFor = id;
            label.className = 'ml-2 text-sm text-gray-700 font-medium cursor-pointer select-none';
            label.textContent = city;

            const div = document.createElement('div');
            div.className = 'flex items-center';
            div.appendChild(checkbox);
            div.appendChild(label);
            cityCheckboxesContainer.appendChild(div);
        });

        // 3. Populate Days (Dropdown)
        daysOfWeek.forEach(day => {
            const option = document.createElement('option');
            option.value = day;
            option.textContent = day;
            dayFilter.appendChild(option);
        });
        dayFilter.addEventListener('change', filterTable);

        filterTable(); 
    }

    // Initialize the filters and table rendering once the page loads
    window.onload = async function() {
        try {
            const response = await fetch(SPREADSHEET_URL);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const csvText = await response.text();
            
            spreadsheetData = parseCSV(csvText);
            
            console.log(`Data loaded successfully. Total ${spreadsheetData.length} rows.`);

            initializeFilters();

        } catch (error) {
            console.error("Could not load data from Google Sheet:", error);
            
            document.getElementById('dataBody').innerHTML = `
                <tr class="bg-white">
                    <td colspan="3" class="py-4 px-6 text-center text-red-600 font-bold italic border-b-2 border-red-200">
                        Error loading spreadsheet data. Please ensure the Google Sheet is publicly shared
                        (File > Share > Publish to the web) and that columns are ordered as:
                        **A: Restaurant**, **B: City**, **C-I: Sun-Sat**. Data is expected to start on **Row 3**.
                        **NOTE: Rows with empty Restaurant (A) or City (B) names are automatically ignored.**
                    </td>
                </tr>
            `;
        }
    };
</script>
